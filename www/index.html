<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طرق عراقنا - الملاحة الذكية</title>
    <!-- Leaflet CSS خارجي للخرائط التفاعلية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #007a3d;
            --secondary-color: #ce1126;
            --dark-color: #111;
            --light-color: #f8f9fa;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--dark-color);
            color: #fff;
            overflow: hidden;
        }
        #map {
            height: calc(100vh - 120px);
            width: 100%;
            z-index: 1;
        }
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--dark-color));
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--secondary-color);
            z-index: 10;
            position: relative;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .iraq-flag-icon {
            width: 35px;
            height: 24px;
            background: linear-gradient(to bottom, #000 33%, #fff 33%, #fff 66%, #ce1126 66%);
            border: 1px solid #fff;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8px;
            color: var(--primary-color);
            font-weight: bold;
        }
        h1 {
            font-size: 18px;
            color: #fff;
        }
        .controls-panel {
            position: absolute;
            bottom: 65px;
            left: 15px;
            right: 15px;
            background: rgba(17, 17, 17, 0.9);
            padding: 12px;
            border-radius: 12px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .btn-report {
            background-color: var(--secondary-color);
            color: white;
        }
        .btn-camera {
            background-color: #ffc107;
            color: #000;
        }
        .btn-sos {
            background-color: #333;
            color: #fff;
            border: 1px solid #555;
        }
        /* شريط إعلانات Adsterra السفلي */
        .ad-container {
            height: 55px;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="iraq-flag-icon">الله أكبر</div>
            <h1>طرق عراقنا (النسخة الذكية)</h1>
        </div>
        <div id="connection-status" style="font-size: 11px; color: #00ffcc;">متصل بالخادم الححي</div>
    </header>

    <!-- الخريطة التفاعلية -->
    <div id="map"></div>
